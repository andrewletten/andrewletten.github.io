name: Publish Quarto Website

on:
  push:
    branches:
      - main
  # Rebuild weekly so new papers on ORCID appear without a push
  # (Sundays 20:00 UTC = Mondays 6am Brisbane)
  schedule:
    - cron: "0 20 * * 0"
  # Allow a manual rebuild from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::httr2
            any::jsonlite
            any::yaml

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: quarto-dev/quarto-actions/render@v2

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
