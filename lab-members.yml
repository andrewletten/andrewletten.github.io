# Current and former lab members, highlighted on the Publications page.
#
# Names are matched against paper author lists by surname plus first name
# (or first initial, when a paper only gives initials). Short forms match the
# full name they start (e.g. "Matt" matches "Matthew"), but other nicknames
# need an alias (e.g. "Maddie" won't match "Madeleine").
#   - orcid:   optional; when given, matching uses the ORCID iD instead, which
#              avoids mixing people up with others who share their name.
#   - aliases: optional; other forms of the name used on papers
#              (e.g. a shortened first name, or a maiden name).
#
# Example:
# - name: Christopher Brown
#   orcid: 0000-0000-0000-0000
#   aliases: [Chris Brown]

