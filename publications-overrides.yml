# Adjustments to the publication list pulled from ORCID.
# List DOIs only (e.g. 10.1111/ele.14507), one per line starting with "- ".

# Papers to hide (e.g. corrections, or anything ORCID has wrong)
exclude: []

# Papers to add that aren't on ORCID (they need a DOI)
include:
  - 10.1371/journal.pbio.3003898   # Orr et al. 2026 PLoS Biology (not yet on ORCID)
  - 10.1002/oik.11467              # Godsoe et al. 2026 Oikos (not on ORCID)
  - 10.1007/s12080-023-00560-6     # Spaak et al. 2023 Theoretical Ecology (not on ORCID)
